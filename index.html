<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Tekanan Zat Padat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; background-color: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Kalkulator Tekanan Zat Padat</h2>
    <div class="input-group">
        <label for="force">Gaya Tekan (F) dalam Newton [N]:</label>
        <input type="number" id="force" value="100">
    </div>
    <div class="input-group">
        <label for="area">Luas Permukaan Tekan (A) dalam m²:</label>
        <input type="number" id="area" value="2" step="0.1">
    </div>
    <button onclick="hitungTekanan()">Hitung Tekanan (P)</button>

    <div class="result" id="output" style="display:none;">
        <p><strong>Besar Tekanan (P):</strong> <span id="p-result">0</span> N/m² (Pascal)</p>
        <p id="keterangan" style="font-size: 0.9em; color: #555;"></p>
    </div>
</div>

<script>
function hitungTekanan() {
    var F = parseFloat(document.getElementById('force').value);
    var A = parseFloat(document.getElementById('area').value);
    
    if (A <= 0 || isNaN(F) || isNaN(A)) {
        alert("Luas permukaan (A) harus lebih besar dari 0!");
        return;
    }
    
    var P = F / A;
    document.getElementById('p-result').innerText = P.toFixed(2);
    
    var ket = "";
    if (A < 1) {
        ket = "Analisis: Luas bidang tekan kecil menghasilkan TEKANAN BESAR (contoh: jarum, pisau tajam).";
    } else {
        ket = "Analisis: Luas bidang tekan besar menghasilkan TEKANAN KECIL (contoh: kaki bebek, alas ban truk).";
    }
    document.getElementById('keterangan').innerText = ket;
    document.getElementById('output').style.display = 'block';
}
</script>

</body>
</html>
